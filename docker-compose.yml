services:
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///./data/techstock.db
      EMAIL_MODE: sandbox
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    volumes:
      - catalog:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - mailpit
  frontend:
    build: .
    command: python -m streamlit run app/Home.py --server.address=0.0.0.0
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy
  shopping:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
volumes:
  catalog:
